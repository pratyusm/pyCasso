[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"


[project]
name = "pycasso-ascii"
version = "1.0.5"
description = "A terminal ASCII art generator for converting images into monochrome and true-color ASCII artwork."
readme = "README.md"
requires-python = ">=3.10"

authors = [
    { name = "Pratyus Mohapatra" }
]

license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]

keywords = [
    "ascii",
    "ascii-art",
    "terminal",
    "cli",
    "image",
    "image-processing",
    "opencv",
]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Artistic Software",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Utilities",
]

dependencies = [
    "numpy",
    "opencv-python",
    "colorama",
    "pyperclip",
    "Pillow",
]


[project.urls]
Repository = "https://github.com/pratyusm/pyCasso"
Issues = "https://github.com/pratyusm/pyCasso/issues"


[project.scripts]
pycasso = "pycasso.cli:main"


[tool.setuptools.packages.find]
where = ["src"]